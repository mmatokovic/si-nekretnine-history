<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nekretnine Šibenik</title>
<style>
  :root { color-scheme: light dark; --muted: #666; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --muted: #999; --line: #333; } }
  body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  p.meta { color: var(--muted); margin-top: 0; }
  input { width: 100%; padding: .5rem; font: inherit; box-sizing: border-box; margin: 1rem 0; }
  ul { list-style: none; padding: 0; }
  li { padding: .6rem 0; border-bottom: 1px solid var(--line); display: flex; gap: 1rem; }
  time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  small { display: block; color: var(--muted); }
</style>
</head>
<body>
<h1>Prodaja nekretnina – Šibenik</h1>
<p class="meta">Arhiva poziva s <a href="https://www.sibensko-kninska-zupanija.hr/pozivi-i-natjecaji">Šibensko-kninske županije</a>
  i <a href="https://gov.sibenik.hr/stranice/gospodarenje-nekretninama/128.html">Grada Šibenika</a>, ažurira se dnevno. <a href="natjecaji.json">JSON</a> · <a id="history" href="#">povijest</a></p>
<input id="q" type="search" placeholder="Filtriraj…" aria-label="Filtriraj pozive">
<ul id="list"><li>Učitavanje…</li></ul>
<script>
  const [owner] = location.hostname.split(".");
  const repo = location.pathname.split("/")[1];
  if (location.hostname.endsWith("github.io") && repo) {
    document.getElementById("history").href = `https://github.com/${owner}/${repo}/commits/main/natjecaji.json`;
  }

  const list = document.getElementById("list");
  const q = document.getElementById("q");
  let items = [];

  function render() {
    const term = q.value.trim().toLowerCase();
    list.replaceChildren(...items
      .filter(i => !term || `${i.title} ${i.source}`.toLowerCase().includes(term))
      .map(i => {
        const li = document.createElement("li");
        const time = document.createElement("time");
        time.dateTime = i.published;
        time.textContent = i.published;
        const a = document.createElement("a");
        a.href = i.link;
        a.textContent = i.title;
        const src = document.createElement("small");
        src.textContent = i.source;
        const div = document.createElement("div");
        div.append(a, src);
        li.append(time, div);
        return li;
      }));
  }

  fetch("natjecaji.json")
    .then(r => r.json())
    .then(data => { items = data; render(); })
    .catch(() => { list.innerHTML = "<li>Greška pri učitavanju podataka.</li>"; });
  q.addEventListener("input", render);
</script>
</body>
</html>
